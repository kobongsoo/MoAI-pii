# 감싸개 공통 시험 — Rust 실행기. bindings/rust/moaipii_dyn.rs 를 그대로 넣어 부른다.
# 작업공간(루트 Cargo.toml)과 따로 빌드한다.
[package]
name = "moaipii-binding-runner"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "runner"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
serde_json = "1"

