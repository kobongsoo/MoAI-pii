[package]
name = "moaipii-test"
# 버전은 moaipii-ffi 와 같게 둔다 — 같은 묶음에 들어가는 DLL 과 짝을 맞추기 위해.
version = "0.1.0"
edition = "2021"
description = "moaipii-test(.exe) — 배포된 moaipii.dll / libmoaipii.so 를 실행 중에 불러 시험하는 CLI."
# FFI 와 같은 빌드 스크립트 — 실행파일 버전 문자열에 같은 git 해시(MOAIPII_GIT)를 새긴다.
build = "../moaipii-ffi/build.rs"

[[bin]]
name = "moaipii-test"
path = "src/main.rs"

[dependencies]
# Rust 감싸개(bindings/rust/moaipii_dyn.rs)를 모듈로 그대로 넣으므로 그쪽 의존을 똑같이 둔다.
# 본체 크레이트(moaipii)에는 기대지 않는다 — 검사는 반드시 DLL 을 거쳐야 하기 때문이다.
libloading = "0.8"
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
# Windows 실행파일·DLL 에 버전 정보 리소스를 넣는다(build.rs 의 win_version_resource)
embed-resource = "2.5"
